    <feTurbulence type="fractalNoise" baseFrequency=".035 .06" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .4  0 0 0 0 .22  0 0 0 .5 -.12"/>
  </filter>
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .9 -.48"/>
  </filter>
  <rect width="240" height="240" fill="#efdfb8"/>
  <rect width="240" height="240" filter="url(#g)"/>
  <rect width="240" height="240" filter="url(#f)"/>
</svg>
