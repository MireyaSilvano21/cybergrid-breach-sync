<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>CyberGrid: Breach & Sync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap" />
</head>
<body>
  <main id="screen-login" class="screen panel-screen">
    <section class="card">
      <h1 class="brand">CyberGrid</h1>
      <p class="sub">Breach &amp; Sync</p>
      <form id="auth-form" novalidate>
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="20" />
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" />
        <p id="auth-error" class="error" role="alert"></p>
        <div class="row">
          <button id="login-btn" type="submit" class="primary">Entrar</button>
          <button id="register-btn" type="button">Crear cuenta</button>
        </div>
      </form>
    </section>
  </main>

  <main id="screen-lobby" class="screen panel-screen" hidden>
    <section class="card wide">
      <header class="lobby-head">
        <h2>Salas</h2>
        <div class="status">
          <span id="socket-status" data-state="disconnected">Desconectado</span>
          <span id="lobby-ping" class="mono">— ms</span>
          <span id="whoami"></span>
          <button id="logout-btn" class="link">Salir</button>
        </div>
      </header>
      <div class="lobby-grid">
        <div>
          <form id="create-room" class="row wrap" novalidate>
            <input id="room-name" placeholder="Nombre de la sala" maxlength="24" required />
            <input id="room-password" placeholder="Contraseña (opcional)" maxlength="32" />
            <button type="submit" class="primary">Crear sala</button>
          </form>
          <p id="lobby-error" class="error" role="alert"></p>
          <ul id="room-list" class="list"></ul>
        </div>
        <aside id="room-panel" hidden>
          <h3 id="room-title"></h3>
          <ul id="room-players" class="list"></ul>
          <div class="row">
            <button id="ready-btn" class="primary" aria-pressed="false">Listo</button>
            <button id="leave-btn">Salir de la sala</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <main id="screen-game" class="screen" hidden>
    <canvas id="game" aria-label="Partida en curso"></canvas>
    <div class="hud top">
      <div class="hp"><div id="hp-bar"></div><span id="hp-text">100</span></div>
      <span id="phase" class="pill"></span>
      <span id="timer" class="mono"></span>
      <span id="ping" class="mono">— ms</span>
      <span id="fps" class="mono"></span>
    </div>
    <div id="sync" class="sync" hidden><div id="sync-bar"></div><span>Sincronizando con el portal…</span></div>
    <p id="hint" class="hint">WASD mover · clic atacar · mantener F junto a un portal abierto para escapar</p>
    <div id="player-state" hidden data-x="0" data-y="0" data-hp="100"></div>
    <div id="touch" class="touch" hidden>
      <div id="stick" class="stick"><div id="knob" class="knob"></div></div>
      <div class="tbtns">
        <button id="t-interact" class="tbtn use" aria-label="Interactuar">Usar</button>
        <button id="t-attack" class="tbtn atk" aria-label="Atacar">Atacar</button>
      </div>
    </div>
    <div id="result" class="result" hidden>
      <div class="card">
        <h2 id="result-title"></h2>
        <ul id="result-list" class="list"></ul>
        <button id="back-btn" class="primary">Volver a la sala</button>
      </div>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
